spring:
  application:
    name: desafio-votacao
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/votacao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:votacao}
    password: ${DB_PASSWORD:votacao}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
